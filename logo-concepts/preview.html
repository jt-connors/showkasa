<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showkasa Logo Concepts</title>
  <style>
    body { margin: 0; background: #0b0d12; color: #f5f1e8; font-family: Inter, system-ui, sans-serif; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 40px 24px 80px; }
    h1 { font-size: 32px; margin: 0 0 12px; }
    p { color: #98a0ad; margin: 0 0 32px; }
    .grid { display: grid; gap: 24px; }
    .card { background: #12161d; border: 1px solid #212734; border-radius: 20px; padding: 18px; }
    .label { font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #b89b68; margin-bottom: 14px; }
    img { width: 100%; border-radius: 16px; display: block; background: #0b0d12; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Showkasa logo concepts</h1>
    <p>Five directions, each with dark and light SVG variants.</p>
    <div class="grid">
      <div class="card"><div class="label">Concept 01, Editorial Space</div><img src="concept-01-dark.svg" alt="Concept 01 dark"><br><img src="concept-01-light.svg" alt="Concept 01 light"></div>
      <div class="card"><div class="label">Concept 02, Split K</div><img src="concept-02-dark.svg" alt="Concept 02 dark"><br><img src="concept-02-light.svg" alt="Concept 02 light"></div>
      <div class="card"><div class="label">Concept 03, Framed Monogram</div><img src="concept-03-dark.svg" alt="Concept 03 dark"><br><img src="concept-03-light.svg" alt="Concept 03 light"></div>
      <div class="card"><div class="label">Concept 04, Cinematic Contrast</div><img src="concept-04-dark.svg" alt="Concept 04 dark"><br><img src="concept-04-light.svg" alt="Concept 04 light"></div>
      <div class="card"><div class="label">Concept 05, Corner Frame</div><img src="concept-05-dark.svg" alt="Concept 05 dark"><br><img src="concept-05-light.svg" alt="Concept 05 light"></div>
    </div>
  </div>
</body>
</html>

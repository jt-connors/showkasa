<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showkasa Icon Concepts</title>
  <style>
    body { margin: 0; background: #0b0d12; color: #f3efe6; font-family: Inter, system-ui, sans-serif; }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 40px 24px 90px; }
    h1 { font-size: 32px; margin: 0 0 10px; }
    p { color: #98a0ad; margin: 0 0 28px; max-width: 920px; }
    .grid { display: grid; gap: 24px; }
    .card { background: #12161d; border: 1px solid #202632; border-radius: 20px; padding: 18px; }
    .label { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #c5a36a; margin-bottom: 14px; }
    .icons { display: grid; grid-template-columns: repeat(2, minmax(220px, 320px)); gap: 16px; }
    .iconCard { background: #0d1016; border: 1px solid #1c2230; border-radius: 18px; padding: 18px; }
    .iconCard.light { background: #f3efe7; }
    img { width: 100%; display: block; border-radius: 16px; }
    .faviconRow { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
    .fav { background: #0d1016; border: 1px solid #1c2230; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; min-width: 78px; }
    .fav.light { background: #f3efe7; }
    .meta { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #8e97a4; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Showkasa, new icon directions</h1>
    <p>Three cleaner icon concepts built for instant recognition, small-size legibility, and a more premium luxury-tech posture.</p>
    <div class="grid">
      <div class="card">
        <div class="label">01, Solid frame</div>
        <div class="icons">
          <div class="iconCard"><img src="icon-concept-01-solid-frame-dark.svg" alt="Solid frame dark"></div>
          <div class="iconCard light"><img src="icon-concept-01-solid-frame-light.svg" alt="Solid frame light"></div>
        </div>
        <div class="faviconRow">
          <div class="fav"><img src="icon-concept-01-solid-frame-dark.svg" style="width:64px;height:64px"><div class="meta">64</div></div>
          <div class="fav"><img src="icon-concept-01-solid-frame-dark.svg" style="width:32px;height:32px"><div class="meta">32</div></div>
          <div class="fav"><img src="icon-concept-01-solid-frame-dark.svg" style="width:16px;height:16px"><div class="meta">16</div></div>
        </div>
      </div>
      <div class="card">
        <div class="label">02, Corner frame</div>
        <div class="icons">
          <div class="iconCard"><img src="icon-concept-02-corner-frame-dark.svg" alt="Corner frame dark"></div>
          <div class="iconCard light"><img src="icon-concept-02-corner-frame-light.svg" alt="Corner frame light"></div>
        </div>
        <div class="faviconRow">
          <div class="fav"><img src="icon-concept-02-corner-frame-dark.svg" style="width:64px;height:64px"><div class="meta">64</div></div>
          <div class="fav"><img src="icon-concept-02-corner-frame-dark.svg" style="width:32px;height:32px"><div class="meta">32</div></div>
          <div class="fav"><img src="icon-concept-02-corner-frame-dark.svg" style="width:16px;height:16px"><div class="meta">16</div></div>
        </div>
      </div>
      <div class="card">
        <div class="label">03, Frame with subtle motion</div>
        <div class="icons">
          <div class="iconCard"><img src="icon-concept-03-frame-motion-dark.svg" alt="Frame motion dark"></div>
          <div class="iconCard light"><img src="icon-concept-03-frame-motion-light.svg" alt="Frame motion light"></div>
        </div>
        <div class="faviconRow">
          <div class="fav"><img src="icon-concept-03-frame-motion-dark.svg" style="width:64px;height:64px"><div class="meta">64</div></div>
          <div class="fav"><img src="icon-concept-03-frame-motion-dark.svg" style="width:32px;height:32px"><div class="meta">32</div></div>
          <div class="fav"><img src="icon-concept-03-frame-motion-dark.svg" style="width:16px;height:16px"><div class="meta">16</div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

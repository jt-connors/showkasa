<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showkasa House + SK Monogram</title>
  <style>
    body { margin: 0; background: #0b0d12; color: #f3efe6; font-family: Inter, system-ui, sans-serif; }
    .wrap { max-width: 1480px; margin: 0 auto; padding: 40px 24px 80px; }
    h1 { font-size: 32px; margin: 0 0 10px; }
    p { color: #98a0ad; margin: 0 0 28px; max-width: 980px; }
    .card { background: #12161d; border: 1px solid #202632; border-radius: 20px; padding: 18px; }
    .label { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #c5a36a; margin-bottom: 14px; }
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    img { width: 100%; display: block; border-radius: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Showkasa, house silhouette + SK monogram</h1>
    <p>A revised premium mark based on the rounded-square lane, rebuilt so the outer silhouette subtly reads as an architectural house form while the SK monogram becomes the core signature.</p>
    <div class="card">
      <div class="label">Dark and light presentation boards</div>
      <div class="duo">
        <img src="showkasa-house-sk-dark.svg" alt="Showkasa house monogram dark" />
        <img src="showkasa-house-sk-light.svg" alt="Showkasa house monogram light" />
      </div>
    </div>
  </div>
</body>
</html>
